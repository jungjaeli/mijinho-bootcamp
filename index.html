<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="정재윤 — IT 계열의 모든 지식을 흡수한다.">
  <title>吸星大法 — 정재윤</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Gowun+Batang:wght@400;700&display=swap');

    :root { color-scheme: light; --paper: #f5f3ed; --ink: #24241f; --muted: #858378; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Gowun Batang', serif; -webkit-font-smoothing: antialiased; }
    .page { max-width: 1160px; min-height: 100svh; margin: auto; padding: 38px 64px 28px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; letter-spacing: 1px; }
    .mark { display: inline-block; width: 18px; height: 18px; background: var(--ink); }
    main { width: 100%; max-width: 820px; margin: auto; padding: 88px 0 74px; }
    h1 { font-family: 'Noto Serif TC', 'PMingLiU', 'Batang', serif; font-size: clamp(62px, 11vw, 132px); font-weight: 900; line-height: 1.25; letter-spacing: .015em; margin: 0; }
    .reading { margin: 14px 0 0 5px; font-size: 12px; letter-spacing: .65em; color: var(--muted); }
    .statement { margin-top: 60px; padding-left: 5px; }
    .name { margin: 0 0 18px; font-size: 22px; font-weight: 700; letter-spacing: .12em; }
    .ambition { margin: 0; font-size: clamp(15px, 2vw, 19px); line-height: 1.9; word-break: keep-all; }
    .links { margin: 64px 0 0 5px; }
    .github { display: inline-flex; align-items: center; gap: 48px; padding: 10px 0; background: none; color: var(--ink); border: 0; border-bottom: 1px solid var(--ink); font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; }
    .github:hover { color: #756650; border-color: #756650; }
    .github:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
    .arrow { font-family: Arial, sans-serif; font-size: 19px; }
    .caption { margin: 12px 0 0; color: var(--muted); font-size: 11px; }
    .status { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    .status:empty { display: none; }
    footer { display: flex; justify-content: space-between; gap: 24px; padding-top: 18px; border-top: 1px solid #d7d3c9; color: var(--muted); font-size: 10px; letter-spacing: .04em; }
    .page-number { font-family: Georgia, serif; }
    @media (max-width: 600px) {
      .page { padding: 28px 25px 24px; }
      main { padding: 80px 0 72px; }
      h1 { font-size: clamp(55px, 15.5vw, 90px); }
      .reading { font-size: 10px; margin-top: 12px; }
      .statement { margin-top: 46px; }
      .name { font-size: 19px; }
      .links { margin-top: 52px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header><span class="mark" aria-hidden="true"></span><span>배우고, 내 것으로.</span></header>
    <main>
      <h1 lang="zh-Hant" aria-label="흡성대법">吸星大法</h1>
      <p class="reading" aria-hidden="true">흡성대법</p>
      <div class="statement">
        <p class="name">정재윤</p>
        <p class="ambition">IT 계열의 모든 지식을 흡수한다.</p>
      </div>
      <div class="links">
        <button class="github" id="github" type="button" aria-describedby="github-status"><span>GitHub</span><span class="arrow" aria-hidden="true">↗</span></button>
        <p class="caption">지금까지 흡수한 것들</p>
        <p class="status" id="github-status" role="status"></p>
      </div>
    </main>
    <footer><span>아직 채울 것이 많다.</span><span class="page-number">01 / ∞</span></footer>
  </div>
  <script>
    // 실제 GitHub 프로필 주소를 입력하면 링크가 활성화됩니다.
    const githubUrl = 'https://github.com/jungjaeli';
    const github = document.getElementById('github');
    if (githubUrl) {
      const link = document.createElement('a');
      link.className = github.className;
      link.href = githubUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.innerHTML = github.innerHTML;
      github.replaceWith(link);
    } else {
      github.addEventListener('click', () => {
        document.getElementById('github-status').textContent = 'GitHub 주소를 연결할 자리입니다.';
      });
    }
  </script>
</body>
</html>
